#
# kalign conda-forge recipe
# big kudos to the original bioconda recipe:
#   https://bioconda.github.io/recipes/kalign3/README.html
# this one:
#   - moves to the new recipe format and rattler-build
#   - updates to newer version
#   - consolidates name to kalign
#   - reports new Apache license
#   - adds an output for kalign-python
#

context:
  version: "3.6.0"

recipe:
  name: kalign-split
  version: ${{ version }}

source:
  url: https://github.com/TimoLassmann/kalign/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4af0af2764509c3e83d501c6d8260b8c69bd8fd02456ed41c18583a23f4781d7
  patches:
    # Allow overriding the hardcoded Homebrew libomp path on macOS and
    # restrict the workaround to AppleClang so other compilers fall back
    # to the standard OpenMP detection path.
    # see: https://github.com/TimoLassmann/kalign/pull/65
    - patches/macos-openmp-config.patch

build:
  number: 0
  skip:
    - win

outputs:

  # kalign binary
  - package:
      name: kalign
      version: ${{ version }}

    build:
      script:
        - mkdir build
        - cd build
        - cmake -DCMAKE_INSTALL_PREFIX=${PREFIX} ..
        - make -j ${CPU_COUNT}
        - make install

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - make
        - cmake
      host:
        - if: osx
          then: llvm-openmp
      run_exports:
        - ${{ pin_subpackage('kalign', upper_bound='x') }}

    tests:
      - script:
          - kalign -v

  # kalign3 synonym to avoid breaking existing users of the bioconda package
  - package:
      name: kalign3

    requirements:
      run:
        - kalign >=3,<4

    tests:
      - script:
          - kalign -v

  # python bindings
  - package:
      name: kalign-python
      version: ${{ version }}

    build:
      script:
        - ${PYTHON} -m pip install . -vv --no-deps --no-build-isolation

    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - make
        - cmake
      host:
        - python
        - pip
        - scikit-build-core
        - pybind11
        - numpy >= 1.19.0

    tests:
      - files:
          source:
            - tests/
        requirements:
          run:
            - pytest
            - pytest-cov
            - pytest-benchmark
            - scikit-bio
            - biopython
        script:
          - pytest tests/python -vv
      - python:
          imports:
            - kalign
          pip_check: true
      - script:
          - kalign-py -h

about:
  homepage: https://github.com/TimoLassmann/kalign
  summary: Kalign is a fast and accurate multiple sequence alignment algorithm.
  license: Apache-2.0
  license_file: COPYING
  # https://doi.org/10.1093/bioinformatics/btz795

extra:
  feedstock-name: kalign
  recipe-maintainers:
    - sdvillal
    - Emrys-Merlin
